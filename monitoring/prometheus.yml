global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: llm-router-local
    environment: dev

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: llm-router-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { tier: "api" }
    scrape_interval: 5s

  - job_name: llm-router-inference
    metrics_path: /metrics
    params: { component: ["inference"] }
    static_configs:
      - targets: ["host.docker.internal:8080"]
    scrape_interval: 10s

  - job_name: vllm-server
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    scrape_interval: 10s
    honor_labels: true

  - job_name: kafka-exporter
    static_configs:
      - targets: ["host.docker.internal:9308"]
    scrape_interval: 30s

  - job_name: clickhouse-exporter
    static_configs:
      - targets: ["host.docker.internal:9116"]
    scrape_interval: 30s

  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
    scrape_interval: 15s

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 15s